[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notifykit"
version = "0.1.0"
description = "通用多通道通知器 — 把任何資料源的摘要發到 Slack / Telegram / LINE（零依賴）"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "kao273183" }]
dependencies = []                 # 執行期零依賴（只用 stdlib）

[project.optional-dependencies]
yaml = ["pyyaml"]                 # 想用 .yaml 設定檔才需要：pip install 'notifykit[yaml]'

[project.scripts]
notifykit = "notifykit.__main__:main"

[tool.setuptools]
packages = ["notifykit"]
